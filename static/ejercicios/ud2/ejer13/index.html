<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">

    <title>TITLE</title>
    <meta name="description" content="DESCRIPTION">

    <link href="styles.css" rel="stylesheet">

    <script defer src="main.js"></script>
</head>

<body>
    <div class="container">
        <div class="foto">
        </div>
        <div class="informacion">
            <div class="nombre">
                <p>Classic Utility Jacket</p>
            </div>
            <div class="precio">
                <p>€110.00</p>
            </div>
            <div class="disponibilidad">
                <p>In Stock</p>
            </div>
            <div class="tallas">
                <ul>
                    <li class="primary">XS</li>
                    <li class="secondary">S</li>
                    <li class="secondary">M</li>
                    <li class="secondary">L</li>
                    <li class="secondary">XL</li>
                </ul>
            </div>
            <div class="botones">
                <button class="boton-comprar primary">Comprar Ahora</button>
                <button class="boton-anadir secondary">Añadir a la cesta</button>
                <button class="boton-favorito secondary">❤</button>
            </div>
            <div class="gastos">
                <p>Free shipping on all continental US orders over $50</p>
            </div>
        </div>
    </div>
</body>

</html>
