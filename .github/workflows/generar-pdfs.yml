# .github/workflows/generar-pdfs.yml
name: Generar PDFs con Puppeteer y desplegar en Vercel

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - '!docs/**/_*/**'
      - '!docs/**/_*'
      - 'scripts/generate-pdf-puppeteer.js'
      - 'scripts/export-single-doc.js'
      - 'static/print.css'
  workflow_dispatch:  # Permite ejecutar manualmente si es necesario
    inputs:
      regenerate_all:
        description: 'Regenerar PDFs de todos los documentos'
        required: false
        default: false
        type: boolean

jobs:
  generar-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Aumentado porque ahora tarda más con scroll y esperas

    steps:
      - name: ⬇️ Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️ Compilar el sitio
        run: npm run build

      - name: � Detectar archivos cambios
        id: changed_files
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.regenerate_all }}" == "true" ]; then
            echo "mode=all" >> $GITHUB_OUTPUT
            echo "Modo: Regenerar TODOS los PDFs"
          else
            echo "mode=changed" >> $GITHUB_OUTPUT
            # Detectar los archivos .md/.mdx cambiados en el último commit en docs/
            CHANGED_FILES=$(git diff HEAD~1 HEAD --name-only -- 'docs/**/*.md' 'docs/**/*.mdx' 2>/dev/null || echo "")
            if [ -z "$CHANGED_FILES" ]; then
              # Si no hay commit anterior (ej: primer commit) o no hay cambios, procesar todos
              echo "changed_list=" >> $GITHUB_OUTPUT
              echo "Modo: Primer commit o sin cambios detectados. Se procesarán todos los PDFs."
            else
              CHANGED_JSON=$(echo "$CHANGED_FILES" | jq -R -s -c 'split("\n")[:-1]')
              echo "changed_list=$CHANGED_JSON" >> $GITHUB_OUTPUT
              echo "Archivos cambios detectados:"
              echo "$CHANGED_FILES"
            fi
          fi

      - name: 🚀 Iniciar servidor Docusaurus en segundo plano
        run: |
          npm run serve &
          echo "Esperando a que el servidor inicie..."
          sleep 10
          # Verificar que el servidor responde
          curl -I http://localhost:3000 || (echo "Error: servidor no responde" && exit 1)

      - name: 🖨️ Generar PDFs con Puppeteer
        run: |
          if [ "${{ steps.changed_files.outputs.mode }}" == "all" ]; then
            npm run export-all-pdfs
          else
            CHANGED_FILES='${{ steps.changed_files.outputs.changed_list }}'
            if [ -z "$CHANGED_FILES" ] || [ "$CHANGED_FILES" == "[]" ]; then
              npm run export-all-pdfs
            else
              node scripts/generate-pdf-puppeteer.js --files="$CHANGED_FILES"
            fi
          fi
        env:
          BASE_URL: http://localhost:3000

      - name: 📤 Commit y push de los PDFs generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add static/pdfs
          if git diff --cached --quiet; then
            echo "✅ No hay cambios en los PDFs. Nada que commitear."
          else
            git commit -m "📄 Actualización automática de PDFs [skip ci]"
            
            # Intentar push con reintento en caso de conflicto
            max_retries=3
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              echo "Intento de push $((retry_count + 1))/$max_retries..."
              
              # Pull con rebase para integrar cambios remotos
              git pull --rebase origin main || true
              
              # Intentar push
              if git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} HEAD:main; then
                echo "✅ Push exitoso"
                break
              else
                retry_count=$((retry_count + 1))
                if [ $retry_count -lt $max_retries ]; then
                  echo "⚠️ Push falló, reintentando en 10 segundos..."
                  sleep 10
                else
                  echo "❌ Push falló después de $max_retries intentos"
                  exit 1
                fi
              fi
            done
          fi
