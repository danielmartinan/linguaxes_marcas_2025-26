<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de tareas</title>
  <link rel="stylesheet" href="ejer1_tareas.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Gestor simple de tareas</h1>
      <p>Completa la funcionalidad con JavaScript.</p>
    </header>

    <section class="task-form" aria-labelledby="nueva-tarea-titulo">
      <h2 id="nueva-tarea-titulo">Nueva tarea</h2>
      <label for="taskInput">Descripcion</label>
      <div class="task-form-row">
        <input id="taskInput" type="text" placeholder="Escribe una tarea">
        <button id="addTaskButton" type="button">Anadir tarea</button>
      </div>
      <p id="errorMessage" class="message" aria-live="polite"></p>
    </section>

    <section class="summary" aria-labelledby="resumen-titulo">
      <h2 id="resumen-titulo">Resumen</h2>
      <div class="summary-grid">
        <p>Total: <span id="totalCount">0</span></p>
        <p>Pendientes: <span id="pendingCount">0</span></p>
        <p>Hechas: <span id="doneCount">0</span></p>
      </div>
    </section>

    <section class="task-list-section" aria-labelledby="lista-titulo">
      <h2 id="lista-titulo">Listado de tareas</h2>
      <ul id="taskList" class="task-list"></ul>
    </section>
  </main>

  <script src="ejer1_tareas.js"></script>
</body>
</html>
