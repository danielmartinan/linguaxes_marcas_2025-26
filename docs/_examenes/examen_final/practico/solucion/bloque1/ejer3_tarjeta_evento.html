<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Evento</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <main class="page">
    <article class="event-card">
      <header class="event-header">
        <p class="event-kicker">Encuentro presencial</p>
        <h1>Foro de Innovacion y Datos</h1>
        <p class="event-subtitle">Una jornada breve para compartir proyectos, herramientas y experiencias.</p>
      </header>

      <section class="event-details" aria-label="Detalles del evento">
        <div class="detail-item">
          <span class="detail-label">Fecha</span>
          <span class="detail-value">18 de junio de 2026</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Lugar</span>
          <span class="detail-value">Salon de actos</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Horario</span>
          <span class="detail-value">09:30 - 13:30</span>
        </div>
      </section>

      <footer class="event-actions">
        <a class="btn btn-primary" href="#">Reservar plaza</a>
        <a class="btn btn-secondary" href="#">Ver programa</a>
      </footer>
    </article>
  </main>
</body>
</html>
